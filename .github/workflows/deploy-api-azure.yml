name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/make-api-deploy.mjs"
      - "admin/**"
      - "vite.admin.config.ts"
      - "tsconfig.admin.json"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: harma-api
  AZURE_RESOURCE_GROUP: rg-portfolio-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: one root install covers the site, api and packages.
      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck -w api

      - name: Test API and shared packages
        run: npm test

      - name: Build API
        run: npm run build -w api

      # Served by the API on portfolio-admin.harmadavtian.com. The Syncfusion
      # licence key is public in the built bundle by design, but kept out of
      # the repo.
      - name: Build admin
        run: npm run build:admin
        env:
          VITE_SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}

      # Dependencies are hoisted to the repo root, so api/ has no complete
      # node_modules. Assemble a standalone folder with production deps only,
      # installed from the root lockfile's exact versions.
      - name: Assemble deploy package
        run: |
          node scripts/make-api-deploy.mjs api-deploy
          cd api-deploy
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          test -f dist/server.js
          test -f admin/index.html
          test -d node_modules/express
          test -d node_modules/mongoose

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Switch runtime to Node 20 LTS
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --linux-fx-version "NODE|20-lts"

      # `az webapp config set` has no --health-check-path flag; the health
      # check path is a site config property set via --generic-configurations.
      - name: Configure startup and health check
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --startup-file "node dist/server.js" \
            --generic-configurations '{"healthCheckPath": "/healthz"}'

      - name: Deploy API package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: api-deploy
